document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: swap;\n  src: url(\"74549614-d966-4586-9f3c-4a8e5b48c0f4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"55e4c887-bb75-4007-a9e1-55fa42bd91a3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"af5ea566-d4d6-455a-9e2d-709d0a9c689d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --font-body:\"Hanken Grotesk\",system-ui,sans-serif;\n  --font-display:\"Space Grotesk\",system-ui,sans-serif;\n\n  /* warm, slightly green-tinted neutrals */\n  --bg:oklch(98.2% 0.006 150);\n  --surface:#ffffff;\n  --surface-2:oklch(97.4% 0.008 150);\n  --surface-3:oklch(95.6% 0.01 150);\n  --border:oklch(91.5% 0.009 150);\n  --border-strong:oklch(86% 0.012 150);\n\n  --ink:oklch(26% 0.02 158);\n  --ink-2:oklch(48% 0.016 158);\n  --ink-3:oklch(63% 0.012 158);\n\n  /* brand + semantic (accent overridable by tweaks) */\n  --accent-h:158;\n  --primary:oklch(56% 0.13 var(--accent-h));\n  --primary-press:oklch(50% 0.13 var(--accent-h));\n  --primary-soft:oklch(95% 0.035 var(--accent-h));\n  --primary-soft-2:oklch(91% 0.05 var(--accent-h));\n  --on-primary:#fff;\n\n  --income:oklch(56% 0.13 158);\n  --income-soft:oklch(95% 0.035 158);\n  --expense:oklch(60% 0.16 28);\n  --expense-soft:oklch(96% 0.03 28);\n\n  /* category tints (consistent L/C, varied H) */\n  --t-green:oklch(64% 0.13 150);\n  --t-emerald:oklch(62% 0.13 165);\n  --t-blue:oklch(64% 0.12 235);\n  --t-violet:oklch(60% 0.13 290);\n  --t-amber:oklch(72% 0.13 70);\n  --t-teal:oklch(66% 0.11 195);\n  --t-pink:oklch(66% 0.15 350);\n  --t-lime:oklch(72% 0.13 120);\n  --t-red:oklch(62% 0.16 25);\n\n  --r:16px; --r-sm:11px; --r-lg:22px; --r-pill:999px;\n  --shadow-sm:0 1px 2px rgba(20,44,32,.05);\n  --shadow:0 1px 2px rgba(20,44,32,.05), 0 10px 28px -16px rgba(20,44,32,.18);\n  --shadow-lg:0 1px 2px rgba(20,44,32,.05), 0 24px 60px -28px rgba(20,44,32,.28);\n  --ring:0 0 0 4px var(--primary-soft-2);\n\n  --sidebar-w:248px;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{\n  font-family:var(--font-body);\n  background:var(--bg);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  font-size:15px; line-height:1.5;\n}\n#root{height:100%}\nbutton{font-family:inherit;cursor:pointer}\ninput,textarea,select{font-family:inherit}\n::selection{background:var(--primary-soft-2)}\n\n/* tabular numerals everywhere money shows up */\n.num{font-family:var(--font-display);font-feature-settings:\"tnum\" 1;letter-spacing:-.01em}\n\n/* scrollbars */\n*::-webkit-scrollbar{width:10px;height:10px}\n*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg)}\n*::-webkit-scrollbar-track{background:transparent}\n\n/* lucide icons baseline */\n[data-lucide]{display:inline-block;vertical-align:middle}\nsvg.lucide{stroke-width:1.9}\n\n/* ---------- App shell ---------- */\n.app{display:flex;height:100%;overflow:hidden}\n.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}\n.scroll{flex:1;overflow-y:auto;overflow-x:hidden}\n.page{max-width:1180px;margin:0 auto;padding:28px 34px 64px}\n\n/* fade/slide on screen change */\n@keyframes rise{from{transform:translateY(10px)}to{transform:none}}\n/* transform-only entrance: content is always visible (robust to static\n   captures & reduced-motion); motion is pure enhancement. */\n.rise{animation:rise .42s cubic-bezier(.2,.7,.2,1)}\n.stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1)}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@media (prefers-reduced-motion: reduce){.rise,.stagger>*{animation:none}}\n\n/* cards */\n.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}\n.card-pad{padding:20px}\n\n/* generic helpers */\n.row{display:flex;align-items:center}\n.muted{color:var(--ink-2)}\n.faint{color:var(--ink-3)}\n.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}\n\n/* pills / chips */\n.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);white-space:nowrap}\n\n/* buttons */\n.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);white-space:nowrap;\n  padding:10px 16px;font-weight:600;font-size:14px;color:var(--ink);background:var(--surface-2);\n  transition:transform .12s ease, background .15s ease, box-shadow .15s ease, border-color .15s}\n.btn:hover{background:var(--surface-3)}\n.btn:active{transform:translateY(1px)}\n.btn-ghost{background:transparent;border-color:var(--border)}\n.btn-ghost:hover{background:var(--surface-2)}\n.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px rgba(20,44,32,.12), 0 8px 18px -10px var(--primary)}\n.btn-primary:hover{background:var(--primary-press)}\n.btn-sm{padding:7px 12px;font-size:13px}\n.btn-icon{padding:9px;border-radius:var(--r-sm)}\n\n/* inputs */\n.field{display:flex;flex-direction:column;gap:7px}\n.field label{font-size:13px;font-weight:600;color:var(--ink-2)}\n.input{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);\n  padding:11px 13px;font-size:14.5px;color:var(--ink);transition:border-color .15s, box-shadow .15s}\n.input::placeholder{color:var(--ink-3)}\n.input:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}\n\n/* tints */\n.tint-green{--c:var(--t-green)} .tint-emerald{--c:var(--t-emerald)} .tint-blue{--c:var(--t-blue)}\n.tint-violet{--c:var(--t-violet)} .tint-amber{--c:var(--t-amber)} .tint-teal{--c:var(--t-teal)}\n.tint-pink{--c:var(--t-pink)} .tint-lime{--c:var(--t-lime)} .tint-red{--c:var(--t-red)}\n.tint-primary{--c:var(--primary)}\n.ic{display:grid;place-items:center;border-radius:12px;background:color-mix(in oklab, var(--c) 15%, white);color:var(--c)}\n\n/* progress */\n.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}\n.bar>span{display:block;height:100%;border-radius:99px;background:var(--c,var(--primary));transition:width .8s cubic-bezier(.2,.7,.2,1)}\n\n.divider{height:1px;background:var(--border)}\n\n/* tooltip-ish */\n.dot{width:8px;height:8px;border-radius:99px;background:var(--c,var(--primary))}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"root\"><\u002Fdiv>\n\n<!-- Icons -->\n<script src=\"https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js\"><\u002Fscript>\n\n<!-- React + Babel (pinned) -->\n<script src=\"ab1f59b6-a398-400c-b54a-ece2e4e07a8d\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"https://unpkg.com/@babel/standalone@7.29.0/babel.min.js\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n\n<script src=\"8edce209-a16e-4030-8e49-8f155ef44c92\"><\u002Fscript>\n<script type=\"text/babel\" src=\"75b7433c-4e35-4322-9894-30cd6f0a31b1\"><\u002Fscript>\n<script type=\"text/babel\" src=\"55a6d705-1bb3-41d8-82e5-08041c05147c\"><\u002Fscript>\n<script type=\"text/babel\" src=\"45c62d18-2c77-495c-8056-f17605497bdd\"><\u002Fscript>\n<script type=\"text/babel\" src=\"a381f1b3-28d4-40bc-b4a3-97d982890cc8\"><\u002Fscript>\n<script type=\"text/babel\" src=\"9868a3bb-6d7b-4812-a0e5-8c41bc3d1565\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
